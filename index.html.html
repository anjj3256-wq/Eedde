<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진로 탐색</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
:root{
    --bg:#0A0E14;
    --panel:#161B22;
    --panel-alt:#0D1117;
    --panel-alt2:#11161D;
    --border:#30363D;
    --text:#E6EDF3;
    --muted:#9BA7B4;
    --muted2:#8B949E;
    --blue:#58A6FF;
    --blue2:#1F6FEB;
    --green:#3FB950;
    --green2:#238636;
    --gold:#F2C14E;
    --silver:#C9D1D9;
    --bronze:#E0995E;
}

*{
    box-sizing:border-box;
}

html,body{
    height:100%;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

.app{
    max-width:850px;
    margin:0 auto;
    padding:36px 20px;
}

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:26px;
    padding:36px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--blue);
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    margin-bottom:10px;
}

.title{
    font-size:34px;
    font-weight:800;
    margin-bottom:10px;
    line-height:1.3;
}

.desc{
    color:var(--muted);
    line-height:1.8;
    margin-bottom:28px;
    font-size:15px;
}

.input{
    width:100%;
    padding:16px;
    border-radius:16px;
    border:1px solid var(--border);
    background:var(--panel-alt);
    color:white;
    font-size:16px;
    outline:none;
}

.input:focus{
    border-color:var(--blue);
}

.start-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    margin-top:16px;
    background:linear-gradient(135deg,var(--blue),var(--blue2));
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.start-btn:hover{
    transform:translateY(-2px);
}

/* ===== 진행바 ===== */

.progress-wrap{
    width:100%;
    height:7px;
    background:var(--panel-alt);
    border-radius:999px;
    overflow:hidden;
    margin-bottom:8px;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--blue),var(--green));
    transition:.3s;
}

.progress-text{
    color:var(--blue);
    font-size:12.5px;
    margin-bottom:14px;
    font-weight:700;
}

/* ===== 문항 / 보기 : 모바일에서 5개 보기가 한 화면에 들어오도록 압축 ===== */

.question{
    font-size:18px;
    font-weight:800;
    line-height:1.45;
    margin-bottom:14px;
}

.option-btn{
    width:100%;
    display:flex;
    align-items:flex-start;
    gap:10px;
    text-align:left;
    padding:12px 14px;
    margin-bottom:8px;
    border-radius:14px;
    border:1px solid var(--border);
    background:var(--panel-alt);
    color:var(--text);
    cursor:pointer;
    transition:.15s;
    font-size:14px;
    line-height:1.42;
}

.option-btn:hover{
    border-color:var(--blue);
    background:#1A222D;
}

.option-btn:active{
    transform:scale(.99);
    background:#1A222D;
}

.option-idx{
    flex:none;
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--panel-alt2);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:11.5px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:1px;
}

.option-btn:hover .option-idx{
    border-color:var(--blue);
    color:var(--blue);
}

.option-label{
    flex:1;
}

textarea{
    width:100%;
    height:210px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:18px;
    padding: 18px 16px;
    box-sizing: border-box;
    color:white;
    font-size:15px;
    line-height:1.7;
    resize:none;
    outline:none;
}

textarea:focus{
    border-color:var(--blue);
    box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
}

.submit-btn{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,var(--green2),var(--green));
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.submit-btn:hover{
    transform:translateY(-2px);
}

.hidden{
    display:none;
}

.admin-btn{
    position:fixed;
    right:20px;
    bottom:20px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--blue);
    padding:14px 18px;
    border-radius:16px;
    cursor:pointer;
    font-weight:700;
    z-index:999;
}

.admin-box{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.admin-panel{
    width:90%;
    max-width:950px;
    max-height:85vh;
    overflow:auto;
    background:var(--panel);
    border-radius:30px;
    border:1px solid var(--border);
    padding:30px;
}

.student-card{
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:22px;
    padding:24px;
    margin-bottom:24px;
}

.close-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:none;
    border-radius:18px;
    background:#DA3633;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

/* ===== 결과창: 추천 학과 카드 ===== */

.result-summary{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:18px;
    padding:16px 18px;
    margin-bottom:24px;
}

.result-summary-emoji{
    font-size:26px;
}

.result-summary-text{
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
}

.rec-card{
    position:relative;
    background:var(--panel-alt);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px 20px 20px;
    margin-bottom:16px;
    overflow:hidden;
}

.rec-card.rank-1{
    border-color:rgba(242,193,78,.45);
    background:linear-gradient(160deg,rgba(242,193,78,.08),var(--panel-alt) 55%);
}

.rec-card.rank-2{
    border-color:rgba(201,209,217,.3);
}

.rec-card.rank-3{
    border-color:rgba(224,153,94,.3);
}

.rec-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
}

.rec-rank{
    flex:none;
    width:34px;
    height:34px;
    border-radius:11px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:14px;
    color:#0A0E14;
}

.rec-rank.rank-1{ background:linear-gradient(135deg,#FFE39A,var(--gold)); }
.rec-rank.rank-2{ background:linear-gradient(135deg,#EDF1F5,var(--silver)); }
.rec-rank.rank-3{ background:linear-gradient(135deg,#F3C79A,var(--bronze)); }

.rec-heading{
    flex:1;
    min-width:0;
}

.rec-eyebrow{
    color:var(--muted2);
    font-size:11.5px;
    font-weight:700;
    letter-spacing:.02em;
    margin-bottom:2px;
}

.rec-name{
    font-size:20px;
    font-weight:800;
    color:var(--text);
}

.rec-related{
    color:var(--muted2);
    font-size:13px;
    margin-bottom:14px;
    line-height:1.6;
}

.rec-block-label{
    color:var(--muted2);
    font-size:12px;
    font-weight:700;
    margin-bottom:8px;
}

.chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:14px;
}

.chip{
    display:inline-block;
    padding:6px 11px;
    border-radius:999px;
    font-size:12.5px;
    line-height:1.3;
    white-space:nowrap;
}

.chip-subject{
    background:rgba(63,185,80,.12);
    color:var(--green);
    border:1px solid rgba(63,185,80,.3);
    font-weight:700;
}

.chip-univ{
    background:var(--panel-alt2);
    color:var(--muted);
    border:1px solid var(--border);
}

@media (max-width:600px){

    .app{
        padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    }

    .card{
        padding:18px 16px;
        border-radius:20px;
    }

    .title{
        font-size:26px;
    }

    /* 문항/보기 화면은 더 압축해서 보기 5개가 한 화면에 들어오도록 함 */

    #test.card{
        padding:16px 14px;
    }

    .progress-wrap{
        height:5px;
        margin-bottom:6px;
    }

    .progress-text{
        font-size:11px;
        margin-bottom:9px;
    }

    .question{
        font-size:15.5px;
        line-height:1.4;
        margin-bottom:10px;
    }

    .option-btn{
        padding:11px 12px;
        margin-bottom:6px;
        border-radius:12px;
        font-size:13px;
        line-height:1.36;
        gap:8px;
    }

    .option-idx{
        width:19px;
        height:19px;
        font-size:10.5px;
    }

    textarea{
        height:170px;
        font-size:14.5px;
        padding:14px;
    }

    .submit-btn{
        padding:13px;
        font-size:14.5px;
    }

    .rec-name{
        font-size:18px;
    }

    .rec-card{
        padding:18px 16px 16px;
    }
}
</style>
</head>

<div class="app">

<div id="login" class="card">
    <div class="title">진로 탐색</div>

    <div class="desc">
    </div>

    <input id="nameInput" class="input" placeholder="이름 입력">

    <button class="start-btn" onclick="startTest()">
        탐색 시작하기
    </button>
</div>

<div id="test" class="card hidden">

    <div class="progress-wrap">
        <div id="bar" class="progress-bar"></div>
    </div>

    <div id="progressText" class="progress-text"></div>

    <div id="question" class="question"></div>

    <div id="options"></div>

    <div id="subjective" class="hidden">
        <textarea id="subjectiveInput" placeholder="여기에 자유롭게 작성하세요..."></textarea>

        <button class="submit-btn" onclick="submitSubjective()">
            답변 제출 후 다음으로
        </button>
    </div>

</div>

</div>

<button class="admin-btn" onclick="openAdmin()">
관리자
</button>

let current = 0;
let username = "";
let answers = [];

function startTest(){

    const value = document.getElementById("nameInput").value.trim();

    if(!value){
        alert("이름을 입력해주세요.");
        return;
    }

    username = value;

    // 만약 이름에 '테스트'라고 적고 시작하면 60문항 건너뛰기 발동!
    if(value === "테스트" || value === "test"){
        answers = [];
        for(let i = 0; i < questions.length; i++){
            answers.push({
                question: questions[i].q,
                answer: i < 40 ? "테스트 선택지 답변" : "바이오화학공학과 및 생명공학 연구에 관심이 많습니다."
            });
        }
        saveResult();
        return;
    }

    document.getElementById("login").classList.add("hidden");
    document.getElementById("test").classList.remove("hidden");

    renderQuestion();
}


function renderQuestion(){

    const q = questions[current];

    document.getElementById("progressText").innerText =
    `${current + 1} / ${questions.length}`;

    document.getElementById("bar").style.width =
    `${((current + 1) / questions.length) * 100}%`;

    document.getElementById("question").innerText = q.q;

    const optionsDiv = document.getElementById("options");
    const subDiv = document.getElementById("subjective");

    optionsDiv.innerHTML = "";

    if(q.type === "obj"){

        optionsDiv.classList.remove("hidden");
        subDiv.classList.add("hidden");

        const optionLetters = ["A","B","C","D","E","F","G","H"];

        q.opt.forEach((option, idx) => {

            const btn = document.createElement("button");

            btn.className = "option-btn";

            btn.innerHTML =
                `<span class="option-idx">${optionLetters[idx] || (idx + 1)}</span>` +
                `<span class="option-label"></span>`;

            btn.querySelector(".option-label").innerText = option;

            btn.onclick = () => {

                answers.push({
                    question:q.q,
                    answer:option
                });

                nextQuestion();
            };

            optionsDiv.appendChild(btn);

        });

    }else{

        optionsDiv.classList.add("hidden");
        subDiv.classList.remove("hidden");

        document.getElementById("subjectiveInput").value = "";

    }

}

function submitSubjective(){
    const textarea = document.getElementById("subjectiveInput");
    const value = textarea ? textarea.value.trim() : "";

    if(!value){
        alert("답변을 입력해주세요.");
        return;
    }

    answers.push({
        question: questions[current].q,
        answer: value
    });

    if(current < questions.length - 1){
        current++;
        renderQuestion();
    } else {
        saveResult();
    }
}

function nextQuestion(){

    if(current < questions.length - 1){
        current++;
        renderQuestion();
    }else{
        saveResult();
    }

}

// 추천 학과 카드 HTML을 만드는 공용 함수 (결과창 / 관리자 페이지에서 공유)
function buildRecommendationCardsHTML(recommended){
    let cardsHTML = "";

    const rankMeta = [
        { badge:"1위", cls:"rank-1" },
        { badge:"2위", cls:"rank-2" },
        { badge:"3위", cls:"rank-3" }
    ];

    recommended.forEach((dept, index) => {
        let univCuts = [];
        for (let i = 1; i <= 6; i++) {
            if (dept[`대학${i}(컷)`]) {
                univCuts.push(dept[`대학${i}(컷)`]);
            }
        }

        const meta = rankMeta[index] || { badge:`${index + 1}위`, cls:"" };

        const subjectChips = (dept['고교학점제 이수과목'] || "")
            .split(",")
            .map(s => s.trim())
            .filter(Boolean)
            .map(s => `<span class="chip chip-subject">${s}</span>`)
            .join("");

        const univChips = univCuts
            .map(u => `<span class="chip chip-univ">${u}</span>`)
            .join("");

        cardsHTML += `
            <div class="rec-card ${meta.cls}">
                <div class="rec-top">
                    <div class="rec-rank ${meta.cls}">${meta.badge}</div>
                    <div class="rec-heading">
                        <div class="rec-eyebrow">성향 맞춤 추천</div>
                        <div class="rec-name">${dept.학과명}</div>
                    </div>
                </div>
                <div class="rec-related">관련 학과 계열 · ${dept['관련학과 1~3순위'] || '정보 없음'}</div>

                <div class="rec-block-label">추천 고교학점제 이수과목</div>
                <div class="chip-row">
                    ${subjectChips || '<span class="chip chip-univ">정보 없음</span>'}
                </div>

                <div class="rec-block-label">주요 대학 입결 참고</div>
                <div class="chip-row" style="margin-bottom:0;">
                    ${univChips || '<span class="chip chip-univ">정보 없음</span>'}
                </div>
            </div>
        `;
    });

    return cardsHTML;
}

// 사용자의 답변과 departmentData를 비교해 상위 3개 학과를 계산
// answerList를 넘기지 않으면 현재 진행 중인 answers를 사용
function getRecommendedDepartments(answerList){
    const targetAnswers = answerList || answers;
    let scoredDepartments = [];

    if (typeof departmentData !== 'undefined' && departmentData.length > 0) {
        scoredDepartments = departmentData.map(dept => {
            let score = 0;
            let targetText = (dept.학과명 || "") + " " + (dept['관련학과 1~3순위'] || "") + " " + (dept['고교학점제 이수과목'] || "");

            targetAnswers.forEach(item => {
                let words = item.answer.split(/[\s,./?~!]+/);
                words.forEach(word => {
                    if (word.length >= 2 && targetText.includes(word)) {
                        score += 1;
                    }
                });
            });

            score += Math.random() * 2;

            return {
                dept: dept,
                score: score
            };
        });

        scoredDepartments.sort((a, b) => b.score - a.score);
    }

    if (scoredDepartments.length > 0) {
        return scoredDepartments.slice(0, 3).map(item => item.dept);
    }

    return typeof departmentData !== 'undefined' ? departmentData.slice(0, 3) : [];
}

function saveResult(){

    // 1. 사용자의 답변을 분석해 추천 학과 3개 계산
    const recommended = getRecommendedDepartments();

    const resultData = {
        name: username,
        date: new Date().toLocaleString(),
        answers: answers,
        recommended: recommended
    };

    // 2. 로컬 스토리지에 결과 저장 (관리자 페이지는 여기서 recommended만 읽어옴)
    localStorage.setItem(
        "psychology_" + username,
        JSON.stringify(resultData)
    );

    // 3. 결과 화면 구성 및 출력
    const appDiv = document.querySelector(".app");

    let resultHTML = `
        <div class="card">
            <div class="eyebrow">✦ 진로 탐색 결과</div>
            <div class="title">${username}님과 잘 맞는 학과예요</div>

            <div class="result-summary">
                <div class="result-summary-emoji">🧭</div>
                <div class="result-summary-text">60문항의 답변 성향을 분석해 회원님과 가장 잘 맞는 학과 3곳을 골랐어요. 순위가 높을수록 답변 성향과의 일치도가 높아요. 주의! 단순한 적성 검사일 뿐, 너무 믿지 말 것~</div>
            </div>

            <div>
                ${buildRecommendationCardsHTML(recommended)}
            </div>
            <button class="submit-btn" onclick="location.reload()" style="margin-top:6px;">
                처음으로 돌아가기
            </button>
        </div>
    `;

    appDiv.innerHTML = resultHTML;
}

function openAdmin(){

    const pw = prompt("관리자 비밀번호 입력");

    if(pw !== "4910"){
        alert("비밀번호 오류");
        return;
    }

    let html = `
    <div class="admin-box" id="adminModal">
        <div class="admin-panel">

        <h1 style="font-size:34px;font-weight:800;margin-bottom:30px;">
        관리자 페이지
        </h1>
    `;

    let found = false;

    for(let i=0;i<localStorage.length;i++){

        const key = localStorage.key(i);

        if(key.startsWith("psychology_")){

            found = true;

            const data =
            JSON.parse(localStorage.getItem(key));

            // 예전 방식으로 저장된 데이터(recommended 없음)는 answers로 즉석 재계산
            const recommended = data.recommended && data.recommended.length > 0
                ? data.recommended
                : getRecommendedDepartments(data.answers || []);

            html += `
            <div class="student-card">

                <div style="
                font-size:26px;
                font-weight:800;
                margin-bottom:10px;
                ">
                ${data.name}
                </div>

                <div style="
                color:#8B949E;
                margin-bottom:20px;
                ">
                제출 시간 : ${data.date}
                </div>

                ${buildRecommendationCardsHTML(recommended)}
            </div>
            `;
        }

    }

    if(!found){

        html += `
        <div style="
        font-size:20px;
        color:#8B949E;
        ">
        저장된 데이터 없음
        </div>
        `;

    }

    html += `
    <button class="close-btn"
    onclick="closeAdmin()">
    관리자 페이지 닫기
    </button>

    </div>
    </div>
    `;

    document.body.insertAdjacentHTML("beforeend",html);

}

function closeAdmin(){

    const modal =
    document.getElementById("adminModal");

    if(modal){
        modal.remove();
    }

}

</script>

</body>
</html>
